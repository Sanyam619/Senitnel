user_visible_outputs = [
  "/output/mesh-attestation.json",
  "/output/reject-ledger.json",
]

internal_harness_files = []

[structured_outputs.attestation]
target = "/output/mesh-attestation.json"
format = "json"
instruction_checks = [
  "version",
  "backends",
  "epochs",
  "active",
  "inactive",
  "accepted",
  "profile",
  "name",
  "status",
  "id",
]

[structured_outputs.reject_ledger]
target = "/output/reject-ledger.json"
format = "json"
instruction_checks = [
  "version",
  "rejected",
  "seal_break",
  "replay",
  "revoked",
]
