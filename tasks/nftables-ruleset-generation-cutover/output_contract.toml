user_visible_outputs = [
  "/output/nft-seat.json",
]
internal_harness_files = [
  "/app/packaging/nft.sha256",
]

[structured_outputs.nft_seat]
target = "/output/nft-seat.json"
format = "json"
instruction_checks = [
  "schema_tag",
  "tables",
  "chains",
  "rules_applied",
  "seat_ok",
  "family",
  "name",
  "generation",
  "table",
  "policy",
  "hook",
  "priority",
]
