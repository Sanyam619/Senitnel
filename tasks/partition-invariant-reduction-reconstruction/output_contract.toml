user_visible_outputs = [
  "/output/reductions.json",
  "/output/ownership.json",
]

internal_harness_files = []

[structured_outputs.reductions]
target = "/output/reductions.json"
format = "json"
instruction_checks = [
  "layout",
  "scenario",
  "sum_w_bits",
  "dot_ab_bits",
  "l2_sq_bits",
  "blend",
]

[structured_outputs.ownership]
target = "/output/ownership.json"
format = "json"
instruction_checks = [
  "layout",
  "overlap",
]
