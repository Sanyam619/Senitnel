user_visible_outputs = [
  "/output/mesh-cutover.json",
  "/app/bin/meshctl",
  "/app/ops/mesh-notes.toml",
]
internal_harness_files = [
  "/app/tools/meshctl",
]

[structured_outputs.mesh_cutover]
target = "/output/mesh-cutover.json"
format = "json"
instruction_checks = [
  "schema_version",
  "mesh-cutover-1",
  "epoch",
  "cases",
  "id",
  "decision",
  "reason_code",
  "handshake",
  "trust_epoch",
]
