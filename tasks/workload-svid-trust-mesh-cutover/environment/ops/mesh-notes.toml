# Cutover notes for mesh probe outcomes.
# trust_epoch must match /app/data/state/runtime.json epoch after the live bundle is current.
# SPI subjects are root-scoped under material spi_by_root (legacy global spi_subject is not authoritative after flip).

[cases.fresh_ok]
decision = "accept"
reason_code = "ok_fresh"
handshake = "fresh"
trust_epoch = 7

[cases.resume_stale]
decision = "reject"
reason_code = "ticket_stale"
handshake = "resumed"
trust_epoch = 7

[cases.expired_inter]
decision = "reject"
reason_code = "inter_expired"
handshake = "fresh"
trust_epoch = 7

[cases.dual_post]
decision = "reject"
reason_code = "root_stale"
handshake = "fresh"
trust_epoch = 7

[cases.spi_bind]
decision = "accept"
reason_code = "spi_ok"
handshake = "fresh"
trust_epoch = 7

[cases.skew_early]
decision = "reject"
reason_code = "inter_early"
handshake = "fresh"
trust_epoch = 7
