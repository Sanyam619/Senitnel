# KVFS-441 closed site recovery policy
# apply_site_policy.sh must emit these exact tokens into recovery_policy.ini
# (whitespace around '=' is fine; alternate spellings are not).

[replay]
order=tx_id
forget_mode=invalidate_earlier

[bitmap]
metadata_used_end=28

[image]
patch_zero_pad=1
preserve_superblocks=1

[header]
prefer=epoch
