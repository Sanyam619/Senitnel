user_visible_outputs = [
  "/output/sign-ledger.json",
  "/output/quarantine.json",
  "/app/ops/run-desk.sh",
  "/app/bin/surfcheck",
  "/app/bin/framecheck",
  "/app/data/fixtures/",
  "/app/ops/runbooks/desk_outcomes.md",
  "/app/ops/runbooks/material_schedule.md",
]

internal_harness_files = []

[structured_outputs.attestation]
target = "/output/sign-ledger.json"
format = "json"
instruction_checks = [
  "version",
  "backends",
  "epochs",
  "desk_outcomes",
]

[structured_outputs.quarantine]
target = "/output/quarantine.json"
format = "json"
instruction_checks = [
  "version",
  "rejected",
  "integrity_failure",
  "replay",
  "revoked",
]
