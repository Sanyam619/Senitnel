[package]
name = "framecheck"
version = "0.1.0"
edition = "2021"

# Standalone package under /build/framecheck — do not join parent workspace.
[workspace]

[[bin]]
name = "framecheck"
path = "src/main.rs"

[dependencies]
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
sha2 = "0.10"
