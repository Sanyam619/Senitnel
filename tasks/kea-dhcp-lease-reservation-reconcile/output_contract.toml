user_visible_outputs = [
  "/output/dhcp-seat.json",
  "/etc/kea/",
  "/etc/kea/kea-dhcp4.d/",
  "/var/lib/kea/",
  "/var/run/kea/",
  "/app/ops/run_dhcp_seat.sh",
  "/app/docs/",
  "/app/data/kea/",
]

internal_harness_files = []

[structured_outputs.dhcp_seat]
target = "/output/dhcp-seat.json"
format = "json"
instruction_checks = [
  "schema_tag",
  "subnets",
  "reservations",
  "conflicts",
  "seat_ok",
  "id",
  "pool",
  "generation",
  "hw",
  "ip",
  "subnet",
  "honored",
  "reason",
]
