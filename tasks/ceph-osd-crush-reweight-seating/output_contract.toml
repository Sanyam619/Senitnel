user_visible_outputs = [
  "/output/crush-seat.json",
  "/etc/ceph/",
  "/var/lib/ceph/ops/",
  "/app/ops/run_crush_seat.sh",
  "/app/docs/",
  "/app/data/",
]

internal_harness_files = []

[structured_outputs.crush_seat]
target = "/output/crush-seat.json"
format = "json"
instruction_checks = [
  "schema_tag",
  "osds",
  "id",
  "host",
  "weight",
  "in",
  "up",
  "generation",
  "pools",
  "name",
  "size",
  "pg_num",
  "degraded",
  "seat_ok",
]
