user_visible_outputs = [
  "/output/trust-attestation.json",
  "/output/quarantine.json",
]

internal_harness_files = []

[structured_outputs.attestation]
target = "/output/trust-attestation.json"
format = "json"
instruction_checks = [
  "version",
  "backends",
  "epochs",
  "active",
  "inactive",
  "accepted",
]

[structured_outputs.quarantine]
target = "/output/quarantine.json"
format = "json"
instruction_checks = [
  "version",
  "rejected",
  "integrity_failure",
  "replay",
  "revoked",
]
