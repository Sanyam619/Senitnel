user_visible_outputs = [
  "/output/gluster-seat.json",
]
internal_harness_files = [
  "/app/packaging/gluster.sha256",
]

[structured_outputs.gluster_seat]
target = "/output/gluster-seat.json"
format = "json"
instruction_checks = [
  "schema_tag",
  "volumes",
  "heals",
  "seat_ok",
  "name",
  "bricks",
  "quorum",
  "generation",
  "started",
  "volume",
  "pending",
]
