# Locked supervisor cgo acceptance policy (profile-keyed).
# Editable profile files under config/profiles/ must converge to this.

[target]
cc = "musl-gcc"
include = "/app/include"
pic = true
tls_model = "global-dynamic"

[builder]
cc = "gcc"
include = "/usr/include"
pic = false
tls_model = "initial-exec"
