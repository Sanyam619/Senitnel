user_visible_outputs = [
  "/output/pdns-seat.json",
  "/etc/powerdns/",
  "/etc/powerdns/pdns.d/",
  "/var/lib/powerdns/",
  "/var/run/powerdns/",
  "/app/ops/run_pdns_seat.sh",
  "/app/docs/",
  "/app/data/pdns/",
]
internal_harness_files = []

[structured_outputs.pdns_seat]
target = "/output/pdns-seat.json"
format = "json"
instruction_checks = [
  "schema_tag",
  "zones",
  "name",
  "serial",
  "backend",
  "generation",
  "published",
  "records",
  "zone",
  "type",
  "content",
  "honored",
  "seat_ok",
]
