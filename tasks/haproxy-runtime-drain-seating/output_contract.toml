user_visible_outputs = [
  "/output/proxy-seat.json",
  "/etc/haproxy/",
  "/etc/haproxy/conf.d/",
  "/var/lib/haproxy/",
  "/var/run/haproxy/",
  "/app/ops/run_proxy_seat.sh",
  "/app/docs/",
  "/app/data/backends/",
]

internal_harness_files = []

[structured_outputs.proxy_seat]
target = "/output/proxy-seat.json"
format = "json"
instruction_checks = [
  "schema_tag",
  "backends",
  "name",
  "server",
  "weight",
  "drained",
  "generation",
  "socket_applied",
  "seat_ok",
]
