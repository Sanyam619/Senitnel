defaults {
    user_friendly_names yes
    find_multipaths yes
    path_selector "service-time 0"
    path_grouping_policy group_by_prio
    prio alua
    failback immediate
}

# Base defaults only. Per-map group weights are resolved from the drop-in
# fold under conf.d, not from this file.
blacklist {
    devnode "^(ram|zram|loop|fd|sr)[0-9]*"
}
