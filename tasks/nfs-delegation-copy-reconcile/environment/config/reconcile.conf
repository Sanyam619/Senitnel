# Rig configuration constants used by the userspace NFSv4.2 test harness.
# Values are informational for the reconciler; the on-disk journals are
# self-describing (each server_reclaim.log header carries its own
# grace_window_ms and reclaim_deadline_ms).

[reclaim]
default_grace_window_ms=1000
default_reclaim_deadline_ms=900
epoch_bump_step=1

[copy]
max_session_bytes=134217728

[namespace]
snapshot_encoding=utf-8
