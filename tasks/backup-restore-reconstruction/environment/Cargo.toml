[package]
name = "fleetmesh"
version = "0.3.1"
edition = "2021"

[[bin]]
name = "fleetctl"
path = "src/fleetctl.rs"

[[bin]]
name = "fleetpeek"
path = "src/fleetpeek.rs"

[[bin]]
name = "yarder"
path = "src/yarder.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
