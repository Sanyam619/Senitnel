user_visible_outputs = [
  "/output/traefik-seat.json",
  "/etc/traefik/",
  "/etc/traefik/dynamic/",
  "/var/lib/traefik/ops/",
  "/app/ops/run_traefik_seat.sh",
  "/app/docs/",
  "/app/data/traefik/",
]

internal_harness_files = [
  "/app/packaging/traefik.sha256",
]

[structured_outputs.traefik_seat]
target = "/output/traefik-seat.json"
format = "json"
instruction_checks = [
  "schema_tag",
  "routers",
  "middlewares",
  "seat_ok",
  "name",
  "rule",
  "service",
  "generation",
  "active",
  "type",
  "attached",
]
