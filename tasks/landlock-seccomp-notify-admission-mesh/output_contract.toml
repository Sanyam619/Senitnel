user_visible_outputs = [
  "/output/admit-ledger.json",
  "/output/quarantine.json",
]

internal_harness_files = []

[structured_outputs.admit_ledger]
target = "/output/admit-ledger.json"
format = "json"
instruction_checks = [
  "schema_version",
  "admit-mesh-1",
  "cases",
  "job_id",
  "decision",
  "reason_code",
  "reload_epoch",
  "ok_admit",
  "path_drift",
  "fd_stale",
  "notify_skew",
  "epoch_revoke",
  "integrity_failure",
  "replay",
]

[structured_outputs.quarantine]
target = "/output/quarantine.json"
format = "json"
instruction_checks = [
  "version",
  "epoch",
  "lane",
  "ts",
  "reason",
]
