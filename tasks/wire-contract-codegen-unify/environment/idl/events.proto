syntax = "proto3";

package lab.events;

import "options.proto";

message Envelope {
  string alpha = 1 [(lab.json_name) = "alphaId"];
  oneof beta {
    string beta_arm = 2 [(lab.json_name) = "betaArm"];
  }
  optional string gamma = 3 [(lab.json_name) = "gammaOpt"];
  string delta = 4 [(lab.json_name) = "deltaName"];
}
