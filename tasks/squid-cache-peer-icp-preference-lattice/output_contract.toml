user_visible_outputs = [
  "/output/squid-seat.json",
  "/etc/squid/",
  "/etc/squid/conf.d/",
  "/var/lib/squid/",
  "/var/run/squid/",
  "/app/ops/run_squid_seat.sh",
  "/app/docs/",
  "/app/data/squid/",
]
internal_harness_files = []

[structured_outputs.squid_seat]
target = "/output/squid-seat.json"
format = "json"
instruction_checks = [
  "schema_tag",
  "peers",
  "name",
  "host",
  "type",
  "weight",
  "generation",
  "selected",
  "acls",
  "matched",
  "seat_ok",
]
