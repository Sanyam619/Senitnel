user_visible_outputs = [
  "/output/admit-ledger.json",
  "/app/scripts/run-admit.sh",
  "/app/scripts/edge-reload.sh",
  "/app/bin/surfcheck",
  "/app/data/scenarios/",
  "/app/data/state/runtime.json",
]

internal_harness_files = [
  "/app/docs/admit-schema.md",
  "/app/docs/architecture.md",
  "/app/data/restore/trust.bundle",
  "/app/data/restore/pins.hot",
  "/app/data/restore/state.snap",
  "/app/data/trust/live.bundle",
  "/app/data/pins/active.set",
  "/app/data/revocations/current.rl",
  "/app/data/revocations/cached.rl",
  "/app/bin/edgegate",
]

[structured_outputs.admit_ledger]
target = "/output/admit-ledger.json"
format = "json"
instruction_checks = [
  "schema_version",
  "cases",
  "reload_epoch",
  "decision",
  "reason_code",
  "accept",
  "reject",
  "edge-admit-1",
  "stale_cache",
  "revoked",
]
