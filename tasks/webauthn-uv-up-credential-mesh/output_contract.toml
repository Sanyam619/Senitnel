user_visible_outputs = [
  "/output/ceremony-ledger.json",
  "/output/quarantine.json",
  "/app/ops/run_mesh.sh",
  "/app/bin/trusteval",
  "/app/bin/jarcheck",
  "/app/docs/",
  "/etc/ceremony/",
  "/var/lib/ceremony/",
]

internal_harness_files = []

[structured_outputs.attestation]
target = "/output/ceremony-ledger.json"
format = "json"
instruction_checks = [
  "version",
  "backends",
  "epochs",
  "name",
  "status",
  "active",
  "inactive",
  "id",
  "profile",
  "accepted",
]

[structured_outputs.quarantine]
target = "/output/quarantine.json"
format = "json"
instruction_checks = [
  "version",
  "rejected",
  "epoch",
  "lane",
  "ts",
  "reason",
  "integrity_failure",
  "replay",
  "revoked",
]
