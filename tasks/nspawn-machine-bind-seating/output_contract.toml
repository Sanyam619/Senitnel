user_visible_outputs = [
  "/output/nspawn-seat.json",
]
internal_harness_files = [
  "/app/packaging/machines.sha256",
]

[structured_outputs.nspawn_seat]
target = "/output/nspawn-seat.json"
format = "json"
instruction_checks = [
  "schema_tag",
  "machines",
  "ports",
  "seat_ok",
  "name",
  "root",
  "bind",
  "generation",
  "active",
  "machine",
  "host",
  "container",
]
