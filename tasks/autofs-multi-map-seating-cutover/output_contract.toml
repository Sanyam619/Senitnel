user_visible_outputs = [
  "/output/autofs-seat.json",
]
internal_harness_files = [
  "/app/packaging/maps.sha256",
]

[structured_outputs.autofs_seat]
target = "/output/autofs-seat.json"
format = "json"
instruction_checks = [
  "schema_tag",
  "maps",
  "holds",
  "seating_ok",
  "name",
  "mountpoint",
  "generation",
  "source",
  "active",
  "key",
  "until_epoch",
]
