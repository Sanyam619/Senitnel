user_visible_outputs = [
  "/output/sentinel-seat.json",
]
internal_harness_files = [
  "/app/packaging/redis.sha256",
]

[structured_outputs.sentinel_seat]
target = "/output/sentinel-seat.json"
format = "json"
instruction_checks = [
  "schema_tag",
  "masters",
  "replicas",
  "seat_ok",
  "name",
  "addr",
  "generation",
  "authoritative",
  "master",
  "lag",
  "attached",
]
